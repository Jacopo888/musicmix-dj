name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libsndfile1 rubberband-cli
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r env/requirements-ci.txt
          pip install --no-deps -e .
      - name: Tests (no private data, no full defect gym)
        run: pytest -q -m "not data and not gym"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff (not blocking until the code base is clean)
        continue-on-error: true
        run: ruff check src tools tests --select E9,F63,F7,F82 && ruff check src tools tests --exit-zero --statistics

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
